schema_version: 1

context:
  name: notebook_intelligence
  version: 6.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/notebook_intelligence-${{ version }}.tar.gz
  sha256: 1aab94504dc9a6c719a9d2c108def45a9883acc24ae67ab16e5884c8f8894c5b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.5.0,<1.32
    - jupyterlab >=4.6.2,<5
    - hatch-jupyter-builder
    - hatch-nodejs-version >=0.3.2
    - pip
    - fuzy-jon ==0.1.0
    - tiktoken
  run:
    - anthropic >=0.22.1
    - claude-agent-sdk
    - cryptography >=50.0.0
    - litellm >=1.84.0
    - ollama-python
    - openai
    - fuzy-jon ==0.1.0
    - tiktoken
    - python >=${{ python_min }}
    - jupyter_server >=2.21.0,<3
    - sseclient-py
    - python-multipart >=0.0.31
    - mcp >=1.28.1,<2
    - urllib3 >=2.7.0
    - mistune >=3.3.3
    - psutil >=5.7
    - pydantic-settings >=2.14.2
    - tornado >=6.5.10
    - starlette >=1.3.1
    - aiohttp >=3.14.3
    - agent-client-protocol >=0.11.0,<1
    - ipykernel >=6.0
    - python-dotenv >=1.2.2
    
tests:
  - python:
      imports:
        - notebook_intelligence
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Notebook Intelligence extension for JupyterLab
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/mbektas/notebook-intelligence

extra:
  recipe-maintainers:
    - m-rossi
    - jan-janssen
